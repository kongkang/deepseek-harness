# The WaiBrain main-dialog composition. The Host owns Agent revisions, dynamic
# external brains, prompt admission, and late-result wakes. Selecting this
# preset outside a WaiBrain-bound Session yields a neutral zero-tool dialog.

- id: waibrain-session
  name: '@deepseek-ai/dsh-host-waibrain/session'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
